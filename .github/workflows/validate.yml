name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 builds are available on Ubuntu 24.04, not Ubuntu 26.04.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.9"
      - name: Validate documentation and license
        run: python tools/check_repository.py
      - name: Test environment and mirror helpers
        run: python -m unittest discover -s tests -v
      - name: Exercise local-only inspection
        run: python skills/mgu-setup/scripts/check_environment.py --profile inspect --json
      - name: Package standalone skill
        run: python tools/package_skill.py
